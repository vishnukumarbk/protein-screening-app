import com.github.gradle.node.npm.task.NpmTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'

	id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.nuclera'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

node {
	download = true
	version = '24.22.1'
	npmInstallCommand = 'ci'
	nodeProjectDir = file('frontend')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

def buildFrontend = tasks.register('buildFrontend', NpmTask) {
	dependsOn tasks.named('npmInstall')
	npmCommand = ['run', 'build']
	inputs.files('frontend/src', 'frontend/public', 'frontend/angular.json', 'frontend/package.json',
			'frontend/package-lock.json', 'frontend/tsconfig.json', 'frontend/tsconfig.app.json')
	outputs.dir('frontend/dist')
}

// copy the Angular build files into the jar as static/
tasks.named('processResources') {
	from(buildFrontend) {
		into 'static'
	}
}

tasks.named('clean') {
	delete 'frontend/dist'
}

// build only the executable jar
tasks.named('jar') {
	enabled = false
}
